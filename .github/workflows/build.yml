name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assemble --refresh-dependencies

      - name: Generate plugins.json
        run: ./gradlew makePluginsJson -PoutputFile="build/plugins.json"

      - name: Mover e Corrigir URLs
        run: |
          REPO_BASE_URL="https://github.com/${{ github.repository }}/raw/refs/heads/main/builds"
          PLUGINS_LIST="[\"$REPO_BASE_URL/plugins.json\"]"

          mkdir -p builds
          mv build/plugins.json builds/plugins.json

          REPO_BASE_URL_ESCAPED=$(echo $REPO_BASE_URL | sed 's/\//\\\//g')

          sed -i -E 's|"url": "[^"]*/([^/]+)\.cs3"|"url": "'"$REPO_BASE_URL_ESCAPED"'/\1.cs3"|g' builds/plugins.json
          sed -i -E 's|"jarUrl": "[^"]*/([^/]+)\.jar"|"jarUrl": "'"$REPO_BASE_URL_ESCAPED"'/\1.jar"|g' builds/plugins.json

          cat > builds/repo.json <<EOF
          {
            "name": "saimuel repo",
            "iconUrl": "https://raw.githubusercontent.com/saimuelbr/sweettheartt/refs/heads/main/RepoIcon.png",
            "description": "saimuelbr repository",
            "manifestVersion": 1,
            "pluginLists": $PLUGINS_LIST
          }
          EOF

          find . -type f -name "*.cs3" -exec cp {} builds/ \; || true
          find . -type f -name "*.jar" ! -name "classes.jar" ! -name "R.jar" ! -name "gradle-wrapper.jar" ! -name "feature-*" ! -path "./libs/*" -exec cp {} builds/ \; || true

      - name: Commit Providers to main branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build: Atualização de plugins"
          branch: main
          file_pattern: builds/*
